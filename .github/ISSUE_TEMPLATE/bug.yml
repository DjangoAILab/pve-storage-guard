name: Bug report
description: Report a reproducible defect without production-sensitive data
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, raw production logs, internal addresses,
        host/guest identities, storage serials, or customer/workload data.
        Report security vulnerabilities privately through the Security tab.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe expected and actual behavior using synthetic identities.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Operating mode
      options: [observer, shadow, canary, enforce, offline replay]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal sanitized reproduction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Include units and whether values are observed or modeled.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed secrets, private network details, raw logs, and real resource identities.
          required: true
