version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-dependencies:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /website
    schedule: { interval: weekly }
    groups:
      documentation-site:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    groups:
      container-base-images:
        patterns: ['*']
