name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l api cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Verify hardened observer unit
        run: sh scripts/verify-systemd-unit.sh
      - name: Validate observer evidence gates
        run: |
          go build -trimpath -o /tmp/pve-storage-guard ./cmd/pve-storage-guard
          PVE_STORAGE_GUARD_TEST_BINARY=/tmp/pve-storage-guard \
            PYTHONWARNINGS=error::ResourceWarning \
            python3 -m unittest \
              scripts.test_validate_nonprod_observer \
              scripts.test_validate_prod_observer_compatibility \
              -v
      - name: Performance smoke benchmarks
        run: go test -run '^$' -bench . -benchtime=100ms -benchmem ./internal/policy ./internal/allocator ./internal/safety ./internal/adapter/pve ./cmd/pve-storage-guard
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1
      - name: Staticcheck
        run: staticcheck ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan Go vulnerabilities
        run: govulncheck ./...
      - name: Python replay tests
        run: python3 -m unittest discover -s poc -p 'test_*.py' -v
      - name: Verify replay golden reports
        run: |
          python3 poc/simulate.py --format markdown > /tmp/report.md
          python3 poc/simulate.py --format json > /tmp/report.json
          diff -u poc/results/report.md /tmp/report.md
          diff -u poc/results/report.json /tmp/report.json
          python3 poc/render_effect_chart.py --check
      - name: Validate JSON documents
        run: |
          for document in api/v1/schema/*.json configs/examples/*.json poc/schema/*.json; do
            python3 -m json.tool "$document" >/dev/null
          done
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error

  systemd-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Test lifecycle rehearsal safety contracts
        run: python3 -m unittest scripts.test_rehearse_systemd_lifecycle -v
      - name: Build byte-distinct observer artifacts
        run: |
          go build -buildvcs=false -trimpath \
            -ldflags '-X main.version=lifecycle-baseline' \
            -o /tmp/pve-storage-guard-baseline ./cmd/pve-storage-guard
          go build -buildvcs=false -trimpath \
            -ldflags '-X main.version=lifecycle-candidate' \
            -o /tmp/pve-storage-guard-candidate ./cmd/pve-storage-guard
      - name: Rehearse systemd restart, cold start, and rollback
        run: |
          sudo env \
            CI=true \
            PVE_STORAGE_GUARD_SYSTEMD_REHEARSAL=ephemeral-ci-v1 \
            python3 scripts/rehearse_systemd_lifecycle.py \
              --baseline-binary /tmp/pve-storage-guard-baseline \
              --candidate-binary /tmp/pve-storage-guard-candidate \
              --unit deploy/systemd/pve-storage-guard-observer.service \
              --fixtures internal/adapter/pve/testdata/pve-9.2-openzfs-2.4 \
              > /tmp/systemd-lifecycle-rehearsal.json
      - name: Verify identity-free lifecycle evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          evidence = json.loads(Path('/tmp/systemd-lifecycle-rehearsal.json').read_text())
          assert evidence['kind'] == 'SystemdLifecycleRehearsal'
          assert evidence['platform'] == 'ephemeral-ubuntu-ci'
          assert evidence['syntheticFixtures'] is True
          assert evidence['policyEvidenceEligible'] is False
          assert evidence['serviceNonRoot'] is True
          assert evidence['initialSamples'] >= 2
          assert evidence['supervisedRestartSamples'] >= 1
          assert evidence['candidateColdStartSamples'] >= 1
          assert evidence['rollbackColdStartSamples'] >= 1
          assert evidence['rollbackBinaryExact'] is True
          assert evidence['rollbackConfigExact'] is True
          assert evidence['unitEnabled'] is False
          assert evidence['binaryParentRestored'] is True
          assert evidence['cleanupComplete'] is True
          assert evidence['requestedProductionMutations'] == 0
          assert len({
              evidence['initialPid'], evidence['restartedPid'],
              evidence['candidatePid'], evidence['rollbackPid'],
          }) == 4
          PY
      - name: Upload lifecycle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: systemd-lifecycle-rehearsal
          path: /tmp/systemd-lifecycle-rehearsal.json
          if-no-files-found: error
          retention-days: 14

  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Go
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Test publication privacy gate
        run: python3 -m unittest scripts.test_check_publication_privacy -v
      - name: Scan publication surfaces
        run: python3 scripts/check_publication_privacy.py
      - name: Scan secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact --exit-code 1

  container:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
      - name: Build without push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: pve-storage-guard:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan container vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pve-storage-guard:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
