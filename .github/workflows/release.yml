name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - name: Install Syft for binary SBOMs
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.42.3
      - name: Release binaries, checksums, and SBOMs
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release archives and SBOMs
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt

  release-assets:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download the immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets
      - name: Verify checksums, SBOMs, and the Linux agent command
        run: |
          set -euo pipefail
          cd release-assets

          version="${GITHUB_REF_NAME#v}"
          for platform in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive="pve-storage-guard_${version}_${platform}.tar.gz"
            test -s "${archive}"
            test -s "${archive}.sbom.json"
            jq -e \
              '(.spdxVersion | startswith("SPDX-")) and (.packages | type == "array")' \
              "${archive}.sbom.json" >/dev/null
          done
          sha256sum --check checksums.txt

          smoke_dir="${RUNNER_TEMP}/pve-storage-guard-release-smoke"
          mkdir "${smoke_dir}"
          tar -xzf "pve-storage-guard_${version}_linux_amd64.tar.gz" \
            -C "${smoke_dir}"
          binary="${smoke_dir}/pve-storage-guard"
          test "$("${binary}" version)" = "${version}"

          set +e
          output="$("${binary}" agent inventory 2>&1)"
          status=$?
          set -e
          test "${status}" -eq 1
          test "${output}" = \
            'agent: --config is required and positional arguments are not accepted'

  container:
    needs: release-assets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.35.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/djangoailab/pve-storage-guard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/djangoailab/pve-storage-guard@${DIGEST}"
