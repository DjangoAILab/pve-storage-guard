  .value{font:700 14px ui-monospace,monospace;fill:#f8fafc}.axis{stroke:#334155;stroke-width:1}.grid{stroke:#1e293b;stroke-width:1}.panel{fill:#0f172a;stroke:#334155;stroke-width:1}
</style>
